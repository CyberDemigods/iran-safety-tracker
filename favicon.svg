<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Original Iran flag (Shir-o-Khorshid) -->
  <rect width="32" height="11" fill="#239f40"/>
  <rect y="11" width="32" height="10" fill="#ffffff"/>
  <rect y="21" width="32" height="11" fill="#da0000"/>
  <!-- Sun with rays -->
  <circle cx="16" cy="16" r="3.2" fill="#f4c430"/>
  <g fill="#f4c430">
    <rect x="15.3" y="10" width="1.4" height="2.5" rx="0.5"/>
    <rect x="15.3" y="19.5" width="1.4" height="2.5" rx="0.5"/>
    <rect x="10" y="15.3" width="2.5" height="1.4" rx="0.5"/>
    <rect x="19.5" y="15.3" width="2.5" height="1.4" rx="0.5"/>
    <rect x="11.2" y="11.2" width="1.4" height="2.5" rx="0.5" transform="rotate(45 11.9 12.45)"/>
    <rect x="19.4" y="11.2" width="1.4" height="2.5" rx="0.5" transform="rotate(-45 20.1 12.45)"/>
    <rect x="11.2" y="18.3" width="1.4" height="2.5" rx="0.5" transform="rotate(-45 11.9 19.55)"/>
    <rect x="19.4" y="18.3" width="1.4" height="2.5" rx="0.5" transform="rotate(45 20.1 19.55)"/>
  </g>
</svg>
